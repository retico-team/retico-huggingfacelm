[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "retico-huggingfacelm"
dynamic = ["version"]
dependencies = [
    "retico-core>=2.0.1",
    "transformers",
    "torch",
]
authors = [
    {name = "Anna Manaseryan"},
]
description = "A Retico module for HuggingFace text generation models."
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["real-time", "HuggingFace", "text-generation", "LM"]

[project.urls]
Repository = "https://github.com/retico-team/retico-huggingfacelm"

[tool.setuptools_scm]
version_file = "retico_huggingfacelm/version.py"
